name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history for enableGitInfo / lastmod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Docsy, Hugo and Sass (pinned in package-lock.json)
        run: npm ci

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build -- --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
