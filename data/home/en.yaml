# Home page (OINK landing). content/en/_index.md only holds title + description.
sections:
  - hero
  - cards

hero:
  eyebrow: kb.wemy.ninja
  title_lines:
    - words:
        - { text: "wem@kb:~$" }
  lead: Notes, how-tos, cheatsheets and write-ups.
  actions:
    - { label: Knowledge Base, url: docs/, icon: fa-solid fa-book, style: primary }
    - { label: Cheatsheets, url: cheatsheets/, icon: fa-solid fa-terminal, style: ghost }

cards:
  columns: 3
  items:
    - title: Knowledge Base
      desc: Structured reference notes — CEFIM (AIS, TSSR, TAI), CTF.
      icon: fa-solid fa-book
      url: docs/
    - title: Cheatsheets
      desc: Quick-reference commands and syntax.
      icon: fa-solid fa-terminal
      url: cheatsheets/
    - title: Blog
      desc: Dated posts and write-ups.
      icon: fa-solid fa-pen-nib
      url: blog/
