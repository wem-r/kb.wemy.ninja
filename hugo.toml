baseURL = "https://kb.wemy.ninja/"
title = "Wem"
enableRobotsTXT = true
enableGitInfo = true          # "Last modified" from git history (CI fetches full history)

# OINK theme (https://github.com/pgsty/oink), git submodule in themes/oink
theme = "oink"

# Content lives under content/en/ so a second language is a config change, not a migration.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[module.hugoVersion]
  extended = true
  min = "0.168.0"

[languages.en]
  label = "English"
  weight = 1
  contentDir = "content/en"
  [languages.en.params]
    description = "Wem's (shitty) knowledge base"

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  section = ["HTML", "RSS", "print"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true           # allow raw HTML from converted notes (tables, iframes)
    [markup.goldmark.parser.attribute]
      block = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  [markup.goldmark.renderHooks.link]
    useEmbedded = "fallback"  # resolve [text](Page.md) links to page URLs

[params]
  copyright = { authors = "wem", from_year = 2026 }
  github_repo = "https://github.com/wem-r/kb.wemy.ninja"
  github_branch = "main"
  offline_search = true       # local Lunr search, no external service

  [params.ui]
    preset = "terminal"       # paper | slate | ink | terminal
    preset_menu = false       # no reader-facing style switcher
    dark_mode = { enable = true, show_menu = true }   # Light / Dark / System menu
    lastmod_commit = "none"   # "Last modified <date>" without the commit message
    reading_time = false
    code_copy = true
    sidebar_menu_compact = true
    sidebar_menu_foldable = true
    [params.ui.feedback]
      enable = false

  [params.links]
    [[params.links.user]]
      name = "GitHub"
      url = "https://github.com/wem-r"
      icon = "fa-brands fa-github"
      desc = "GitHub"
    [[params.links.user]]
      name = "wemy.ninja"
      url = "https://wemy.ninja/"
      icon = "fa-solid fa-house"
      desc = "Main site"

# Navbar entries for sites outside this repo (internal sections add
# themselves via `menu:` in their _index.md front matter).
[menus]
  [[menus.main]]
    name = "Tools"
    url = "https://tools.wemy.ninja/"
    weight = 40
