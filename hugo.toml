baseURL = "https://wemy.ninja/"
title = "Wem"
enableRobotsTXT = true
enableGitInfo = true          # "last modified" from git history (CI fetches full history)

# Own theme, in themes/wem/ (tiling-window-manager look).
theme = "wem"

# Content lives under content/en/ so a second language is a config change, not a migration.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[module.hugoVersion]
  extended = true
  min = "0.168.0"

[languages.en]
  label = "English"
  weight = 1
  contentDir = "content/en"
  [languages.en.params]
    description = "Wem's (shitty) knowledge base"

[taxonomies]
  tag = "tags"
  category = "categories"

# Extra outputs used by the theme: /index.json (search) and /graph.json (graph tile).
[outputFormats]
  [outputFormats.searchindex]
    mediaType = "application/json"
    baseName = "index"
    isPlainText = true
    notAlternative = true
  [outputFormats.graph]
    mediaType = "application/json"
    baseName = "graph"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "searchindex", "graph"]
  section = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true           # allow raw HTML from converted notes (tables, iframes)
    [markup.goldmark.parser.attribute]
      block = true
  [markup.highlight]
    noClasses = false         # colours come from the theme's CSS (dark + light)
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  [markup.goldmark.renderHooks.link]
    useEmbedded = "fallback"  # (the theme has its own link hook: pages + attachments)

[params]
  github_repo = "https://github.com/wem-r/kb.wemy.ninja"
  github_branch = "main"

  [params.wem]
    noindex = true            # <meta name="robots" content="noindex, nofollow">
    prompt = "wem@kb"
    # Top-bar workspaces, in order (keys 1-4). "section" marks it active on that section's pages.
    [[params.wem.workspaces]]
      name = "kb"
      url = "kb/"
      section = "kb"
      desc = "knowledge base"
    [[params.wem.workspaces]]
      name = "cheat"
      url = "cheatsheets/"
      section = "cheatsheets"
      desc = "cheatsheets"
    [[params.wem.workspaces]]
      name = "blog"
      url = "blog/"
      section = "blog"
      desc = "posts"
    [[params.wem.workspaces]]
      name = "tools"
      url = "https://tools.wemy.ninja/"
      external = true
      desc = "tools.wemy.ninja"
